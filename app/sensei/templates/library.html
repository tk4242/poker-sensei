{% extends "base.html" %}
{% block body %}

<div class="panel"><ul class="list">

<li><a href="{{ url_for('learn.sources') }}">出典台帳</a> <span class="muted small">sources/SOURCES.md</span></li>

</ul></div>
{% endblock %}
