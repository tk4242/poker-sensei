{% extends "base.html" %}
{% block body %}
<p class="small"><a href="{{ url_for('records.index') }}">← 記録</a></p>
<h1>プレイの記録</h1>
<form method="post" class="panel stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="row2">
    <label>日付<input type="date" name="date" value="{{ row.date if row else today }}"></label>
    <label>場所の種類<select name="venue" required>{% for k, v in venues.items() %}<option value="{{ k }}" {{ 'selected' if row and row.venue == k }}>{{ v }}</option>{% endfor %}</select></label>
  </div>
  <label>大会名・店名<input type="text" name="event" value="{{ row.event if row else '' }}"></label>
  <div class="row3">
    <label>バイイン<input type="number" step="any" name="buyin" value="{{ row.buyin if row and row.buyin is not none else '' }}"></label>
    <label>通貨<select name="currency">{% for c in ['JPY','USD','EUR','KRW','PHP','VND','AUD'] %}<option {{ 'selected' if row and row.currency == c }}>{{ c }}</option>{% endfor %}</select></label>
    <label>賞金<input type="number" step="any" name="prize" value="{{ row.prize if row and row.prize is not none else '' }}"></label>
  </div>
  <div class="row3">
    <label>参加人数<input type="number" name="entries" value="{{ row.entries if row and row.entries is not none else '' }}"></label>
    <label>順位<input type="number" name="finish" value="{{ row.finish if row and row.finish is not none else '' }}"></label>
    <label>時間（h）<input type="number" step="0.25" name="hours" value="{{ row.hours if row and row.hours is not none else '' }}"></label>
  </div>
  <div class="checks"><label><input type="checkbox" name="itm" value="1" {{ 'checked' if row and row.itm }}> インマネ（入賞）した</label></div>
  <p class="muted small">アミューズメントの賞品・ポイントは「賞金」欄に書かなくてOK（換金できないため）。</p>
  <div class="row2">
    <label>体調（1〜5）<input type="number" name="condition" min="1" max="5" value="{{ row.condition if row and row.condition is not none else '' }}"></label>
    <label>ティルトの強さ（0〜5）<input type="number" name="tilt" min="0" max="5" value="{{ row.tilt if row and row.tilt is not none else 0 }}"></label>
  </div>
  <label>周りに合わせて決めたハンドの数（自分の判断より、周りの雰囲気で決めたハンド）<input type="number" name="conformed" min="0" max="200" value="{{ row.conformed if row and row.conformed is not none else '' }}" placeholder="例: 2（数えていなければ空欄）"></label>
  <p class="muted small">数えるだけで減っていきます。3回以上なら、いちばん引っかかった1つをメンタル・ハンドヒストリーに書きましょう（<a href="{{ url_for('learn.library_file', name='05-numbers-and-confidence.md') }}">教材 05 の 5-4</a>）。</p>
  <label>出たティルトの種類（Tendler の7種）</label>
  <div class="checks">{% for t in tilt_types %}<label><input type="checkbox" name="tilt_types" value="{{ t }}" {{ 'checked' if row and t in (row.tilt_types or '') }}> {{ t }}</label>{% endfor %}</div>
  <label>相手のタイプ分け（Stage 5 の合格ラインで数えます）</label>
  <div class="checks">{% for t in opp_types %}<label><input type="checkbox" name="opp_types" value="{{ t }}" {{ 'checked' if row and t in (row.opponents or '') }}> {{ t }}</label>{% endfor %}</div>
  <label>相手についてのメモ<input type="text" name="opponents" placeholder="例: 左の人はリバーの大きいベットが全部バリューだった"></label>
  <label>良かった判断<textarea name="good">{{ row.good if row else '' }}</textarea></label>
  <label>改善したい判断<textarea name="improve">{{ row.improve if row else '' }}</textarea></label>
  <label>メモ<textarea name="notes">{{ row.notes if row else '' }}</textarea></label>
  <p><button class="btn" type="submit">保存</button></p>
</form>
{% if row %}<form method="post" action="{{ url_for('records.delete', kind='session', rid=row.id) }}" data-confirm="この記録を削除しますか？"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn danger small" type="submit">削除</button></form>{% endif %}
{% endblock %}
