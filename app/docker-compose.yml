# 起動: cd app && docker compose up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      SECURE_COOKIES: "1"
    volumes:
      - sensei-data:/data
    restart: unless-stopped
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?app/.env に DOMAIN を書いてください}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  sensei-data:
  caddy-data:
  caddy-config:
